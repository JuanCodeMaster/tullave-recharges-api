name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, test y verificación de imagen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas unitarias y de controlador
        run: ./mvnw -B test

      - name: Pruebas de integración (Testcontainers + PostgreSQL)
        run: ./mvnw -B verify -Pit

      - name: Construir imagen Docker
        run: docker build -t tullave/recharges-api:ci .
